plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gu'
version = '1.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Embedded Tomcat + Jasper (JSP compiler): providedCompile (not providedRuntime) because the
    // whole codebase compiles directly against javax.servlet.* — needed at compile time too, not
    // just runtime. Excluded from WEB-INF/lib when deployed to an external container that
    // supplies its own.
    providedCompile 'org.springframework.boot:spring-boot-starter-tomcat'
    providedCompile 'org.apache.tomcat.embed:tomcat-embed-jasper'

    implementation 'javax.servlet:jstl:1.2'

    // Manual transaction management (see BoardSvc/CrudSvc) and the dataSource's
    // DataSourceTransactionManager bean need spring-tx/spring-jdbc, which
    // spring-boot-starter-web doesn't pull in on its own.
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'

    // log (logback/slf4j versions come from Boot's own BOM via spring-boot-starter-web, which
    // pulls a matched logging stack — don't pin these independently, Boot's logging
    // auto-configuration expects its own tested logback/slf4j pairing)
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'

    // db (MariaDB Connector/J, since the app targets a MariaDB server)
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
    implementation 'org.mybatis:mybatis:3.5.19'
    implementation 'org.mybatis:mybatis-spring:2.1.2'
    implementation 'org.apache.commons:commons-dbcp2:2.14.0'
    implementation 'org.apache.commons:commons-pool2:2.13.1'

    // YAML config (backs YamlPropertiesFactoryBean in applicationContext.xml; version managed
    // by Boot's BOM)
    implementation 'org.yaml:snakeyaml'

    // file upload (backs the CommonsMultipartResolver bean in dispatcher-servlet.xml)
    implementation 'commons-io:commons-io:2.19.0'
    implementation 'commons-fileupload:commons-fileupload:1.6.0'

    // excel (jxls-core drives templates; POI stays pinned to 3.14, see CLAUDE.md)
    implementation 'net.sf.jxls:jxls-core:1.0.6'
    implementation 'org.apache.poi:poi:3.14'
    implementation 'org.apache.poi:poi-ooxml:3.14'

    implementation 'com.sun.mail:javax.mail:1.6.2'

    implementation 'cglib:cglib:3.3.0'
}
