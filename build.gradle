apply plugin: 'java'
apply plugin: 'war'

group = 'com.gu'
version = '1.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

configurations.all {
    // Spring 4.x's internal logging goes through commons-logging; jcl-over-slf4j below provides
    // those same classes routed into logback instead. Excluding the real commons-logging jar
    // (pulled in transitively by spring-core) avoids two jars defining the same classes.
    exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
    providedCompile 'javax:javaee-web-api:8.0.1'

    // Spring 4 (4.3.30.RELEASE is the last Spring 4.x release; still javax-based)
    implementation 'org.springframework:spring-core:4.3.30.RELEASE'
    implementation 'org.springframework:spring-web:4.3.30.RELEASE'
    implementation 'org.springframework:spring-webmvc:4.3.30.RELEASE'
    implementation 'org.springframework:spring-tx:4.3.30.RELEASE'
    implementation 'org.springframework:spring-orm:4.3.30.RELEASE'

    implementation 'cglib:cglib:3.3.0'
    implementation 'javax.servlet:jstl:1.2'

    // log
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'org.slf4j:jcl-over-slf4j:2.0.18'
    implementation 'ch.qos.logback:logback-core:1.3.16'
    implementation 'ch.qos.logback:logback-classic:1.3.16'

    // db (MariaDB Connector/J, since the app targets a MariaDB server)
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.10'
    implementation 'org.mybatis:mybatis:3.5.19'
    implementation 'org.mybatis:mybatis-spring:1.3.3'
    implementation 'org.apache.commons:commons-dbcp2:2.14.0'
    implementation 'org.apache.commons:commons-pool2:2.13.1'

    // YAML config (backs YamlPropertiesFactoryBean in applicationContext.xml)
    implementation 'org.yaml:snakeyaml:1.33'

    // file upload
    implementation 'commons-io:commons-io:2.19.0'
    implementation 'commons-fileupload:commons-fileupload:1.6.0'

    // json request
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    // excel (jxls-core drives templates; POI stays pinned to 3.14 since jxls-core:1.0.6 is an
    // old, unmaintained library that calls internal POI 3.x APIs directly)
    implementation 'net.sf.jxls:jxls-core:1.0.6'
    implementation 'org.apache.poi:poi:3.14'
    implementation 'org.apache.poi:poi-ooxml:3.14'

    implementation 'com.sun.mail:javax.mail:1.6.2'
}
