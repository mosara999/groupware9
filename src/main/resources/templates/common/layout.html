<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="layout(title, content, extraHead)">
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title th:replace="${title}">Page Title</title>
    <link th:href="@{/css/sb-admin/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin/metisMenu.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin/sb-admin-2.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin/font-awesome.min.css}" rel="stylesheet" type="text/css">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <script th:src="@{/js/jquery-2.2.3.min.js}"></script>
    <script th:src="@{/css/sb-admin/bootstrap.min.js}"></script>
    <script th:src="@{/css/sb-admin/metisMenu.min.js}"></script>
    <script th:src="@{/css/sb-admin/sb-admin-2.js}"></script>
    <script th:src="@{/js/project9.js}"></script>
    <th:block th:if="${extraHead != null}" th:replace="${extraHead}"></th:block>
</head>

<body>

    <div id="wrapper">
        <div th:replace="~{common/navigation :: nav}"></div>

        <div id="page-wrapper">
            <div th:replace="${content}"></div>
        </div>
        <!-- /#page-wrapper -->

    </div>
    <!-- /#wrapper -->

</body>

</html>
</th:block>
</html>
