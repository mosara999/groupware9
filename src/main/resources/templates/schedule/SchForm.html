<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(title=~{::title}, content=~{::section}, extraHead=~{::extraHead})}">

<head>
    <title th:text="#{common.pageTitle}">Groupware</title>
</head>

<th:block th:fragment="extraHead">
	<link th:href="@{/js/datepicker/datepicker.css}" rel="stylesheet" type="text/css">
	<script th:src="@{/js/datepicker/bootstrap-datepicker.js}"></script>
</th:block>

<body>
<section>

            <div class="row">
                <div class="col-lg-12">
                    <h1 class="page-header"><i class="fa fa-gear fa-fw"></i> 일정관리</h1>
                </div>
                <!-- /.col-lg-12 -->
            </div>

            <!-- /.row -->
            <div class="row">
            	<form id="form1" name="form1" role="form" action="schSave" method="post" >
            		<input type="hidden" name="ssno" th:value="${schInfo?.ssno}">
					<div class="panel panel-default schForm">
	                    <div class="panel-body">
	                    	<div class="row form-group">
	                            <label class="col-lg-1">일정명</label>
	                            <div class="col-lg-8">
	                            	<input type="text" class="form-control" id="sstitle" name="sstitle" maxlength="50"
	                            	th:value="${schInfo?.sstitle}">
	                            </div>
	                        </div>
	                    	<div class="row form-group">
	                            <label class="col-lg-1">구분</label>
	                            <div class="col-lg-8">
									<label style="margin-right: 5px" th:each="t : ${sstypelist}">
										<input type="radio" th:checked="${t.codecd == schInfo?.sstype}"
											 id="sstype" name="sstype" th:value="${t.codecd}"> <span th:text="${t.codenm}"></span></label>
	                            </div>
	                        </div>
	                    	<div class="row form-group">
	                            <label class="col-lg-1">일시</label>
	                            <div class="col-lg-2">
	                            	<input class="form-control" size="16" id="ssstartdate" name="ssstartdate" th:value="${schInfo?.ssstartdate}" readonly>
	                            </div>
	                            <div class="col-lg-1">
		                           	<select id="ssstarthour" name="ssstarthour" class="form-control">
										<option th:each="h : ${#numbers.sequence(1, 24)}" th:with="sshour=${#numbers.formatInteger(h, 2)}"
											th:value="${sshour}" th:selected="${sshour == schInfo?.ssstarthour}" th:text="${sshour}"></option>
									</select>
								 </div>
	                            <div class="col-lg-1">
		                           	<select id="ssstartminute" name="ssstartminute" class="form-control">
										<option th:each="m : ${#strings.arraySplit('00,10,20,30,40,50', ',')}"
											th:value="${m}" th:selected="${m == schInfo?.ssstartminute}" th:text="${m}"></option>
									</select>
								 </div>
	                             <div class="col-lg-2">
	                            	<input class="form-control" size="16" id="ssenddate" name="ssenddate" th:value="${schInfo?.ssenddate}" readonly>
	                             </div>
	                            <div class="col-lg-1">
		                           	<select id="ssendhour" name="ssendhour" class="form-control">
										<option th:each="h : ${#numbers.sequence(1, 24)}" th:with="sshour=${#numbers.formatInteger(h, 2)}"
											th:value="${sshour}" th:selected="${sshour == schInfo?.ssendhour}" th:text="${sshour}"></option>
									</select>
								 </div>
	                            <div class="col-lg-1">
		                           	<select id="ssendminute" name="ssendminute" class="form-control">
										<option th:each="m : ${#strings.arraySplit('00,10,20,30,40,50', ',')}"
											th:value="${m}" th:selected="${m == schInfo?.ssendminute}" th:text="${m}"></option>
									</select>
								 </div>
	                        </div>
	                    	<div class="row form-group">
	                            <label class="col-lg-1">반복</label>
	                            <div class="col-lg-2">
		                           	<select id="ssrepeattype" name="ssrepeattype" class="form-control" onchange="ssrepeattypeChange()">
		                           		<option value="1" th:selected="${schInfo?.ssrepeattype == '1'}">반복없음</option>
		                           		<option value="2" th:selected="${schInfo?.ssrepeattype == '2'}">주간반복</option>
		                           		<option value="3" th:selected="${schInfo?.ssrepeattype == '3'}">월간반복</option>
									</select>
	                            </div>
	                            <div class="col-lg-1">
		                           	<select id="ssrepeatoption" name="ssrepeatoption" class="form-control" style="display:none">
									</select>
	                            </div>
	                            <div class="col-lg-2">
	                            	<input class="form-control" size="16" id="ssrepeatend" name="ssrepeatend" th:value="${schInfo?.ssrepeatend}"  style="display:none" readonly>
	                            </div>
	                        </div>
	                    	<div class="row form-group">
	                            <label class="col-lg-1">공개</label>
	                            <div class="col-lg-8">
	                            	<label style="margin-right: 5px"><input type="radio" th:checked="${schInfo?.ssisopen == 'Y'}"
	                            		 id="ssisopen" name="ssisopen" value="Y"> 공개</label>
	                            	<label style="margin-right: 5px"><input type="radio" th:checked="${schInfo?.ssisopen == 'N'}"
	                            		 id="ssisopen" name="ssisopen" value="N"> 비공개</label>
	                            </div>
	                        </div>
	                    	<div class="row form-group">
	                            <label class="col-lg-1">내용</label>
	                            <div class="col-lg-8">
	                            	<textarea class="form-control" id="sscontents" name="sscontents" th:text="${schInfo?.sscontents}"></textarea>
	                            </div>
	                        </div>
	                    </div>
	                </div>
				</form>
		        <button class="btn btn-outline btn-primary" onclick="fn_formSubmit()" th:text="#{common.btnSave}"></button>
		        <button th:if="${schInfo?.ssno != null}" class="btn btn-outline btn-primary" onclick="fn_delete()" th:text="#{common.btnDelete}"></button>
            </div>
            <!-- /.row -->

    <script>
    window.onload = function() {
        $('#ssstartdate').datepicker().on('changeDate', function(ev) {
            if (ev.viewMode=="days"){
                $('#ssstartdate').datepicker('hide');
            }
        });
        $('#ssenddate').datepicker().on('changeDate', function(ev) {
            if (ev.viewMode=="days"){
                $('#ssenddate').datepicker('hide');
            }
        });
        $('#ssrepeatend').datepicker().on('changeDate', function(ev) {
            if (ev.viewMode=="days"){
                $('#ssrepeatend').datepicker('hide');
            }
        });
        ssrepeattypeChange();
    }

    function fn_formSubmit(){
    	if ( ! chkInputValue("#sstitle", "일정명")) return false;
    	if ( ! chkInputValue("#sscontents", "내용")) return false;

    	fn_confirm("저장 하시겠습니까?", function(){
    		$("#form1").submit();
    	});
    }

    function fn_delete(){
    	fn_confirm("삭제 하시겠습니까?", function(){
    		$("#form1").attr("action", "schDelete");
    		$("#form1").submit();
    	});
    }

    function ssrepeattypeChange(){
    	$("#ssrepeatoption").hide();
    	$("#ssrepeatend").hide();
    	if ($("#ssrepeattype").val()==="1") return;

    	$("#ssrepeatoption").show();
    	$("#ssrepeatend").show();

    	if ($("#ssrepeatend").val()==="")	$("#ssrepeatend").val($("#ssenddate").val());
    	$("#ssrepeatoption").empty();
    	if ($("#ssrepeattype").val()==="2") {
    		var week = ["일", "월", "화", "수", "목", "금", "토"];
    		for (var i=0; i<week.length; i++) {
    			$('<option value="'+ i +'">' + week[i] + '</option>').appendTo($("#ssrepeatoption"));
    		}
    	} else
    	if ($("#ssrepeattype").val()==="3") {
    		for (var i=1; i<=31; i++) {
    			var str = "0" + String(i);
    			str = str.substring(str.length-2);
    			$('<option value="'+ str +'">' + str + '</option>').appendTo($("#ssrepeatoption"));
    		}
    	}
    }
    </script>
</section>
</body>

</html>
